<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4a - Q2: Smart Number Validator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;

      padding: 6px 10px;

    button {
      cursor: pointer;
    }

      font-weight: bold;
